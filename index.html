<script src="files/schedule.js"></script>

<script>
  const data = scheduleData;

  document.getElementById("title").textContent = data.title;

  const table = document.getElementById("schedule-table");

  // Header row
  const header = document.createElement("tr");
  header.innerHTML =
    `<th class="time"></th>` +
    data.days.map(d => `<th>${d}</th>`).join("");
  table.appendChild(header);

  // Rows
  Object.entries(data.rows).forEach(([time, cols]) => {
    const tr = document.createElement("tr");

    tr.innerHTML =
      `<th class="time">${time}</th>` +
      data.days.map(day => {
        const cell = cols[day];
        const text = cell ? cell.text : "";
        const type = cell ? cell.type : "sched";
        return `<td class="${type}">${text}</td>`;
      }).join("");

    table.appendChild(tr);
  });

  // Important dates
  const ul = document.getElementById("dates");
  data.importantDates.forEach(d => {
    const li = document.createElement("li");
    li.textContent = d;
    ul.appendChild(li);
  });
</script>
